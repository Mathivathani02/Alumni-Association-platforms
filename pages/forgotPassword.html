<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Alumni Connect</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="form-box">
    <h2><i class="fa-solid fa-key"></i> Forgot Password</h2>
    <p class="subtitle">Enter your email and we'll generate a reset token.</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="forgotForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-block" id="submitBtn">Send Reset Token</button>
    </form>

    <div id="tokenBox" style="display:none; margin-top:18px; padding:14px; background:#f5f7fa; border-radius:8px; font-size:0.85rem; word-break:break-all;">
        <strong>Demo mode:</strong> this project has no email service configured, so your reset token is shown here directly.<br><br>
        <span id="tokenValue"></span>
        <div style="margin-top:12px;"><a href="resetPassword.html" class="btn btn-sm">Go to Reset Password page &rarr;</a></div>
    </div>

    <p class="form-footer"><a href="login.html">&larr; Back to login</a></p>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
const form = document.getElementById('forgotForm');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const tokenBox = document.getElementById('tokenBox');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg(errorMsg); hideMsg(successMsg);
    submitBtn.disabled = true; submitBtn.textContent = 'Please wait...';

    try {
        const data = await apiFetch('/auth/forgot-password', {
            method: 'POST',
            body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        successMsg.textContent = data.message;
        successMsg.style.display = 'block';
        if (data.resetToken) {
            document.getElementById('tokenValue').textContent = data.resetToken;
            tokenBox.style.display = 'block';
        }
    } catch (err) {
        showError(errorMsg, err.message);
    } finally {
        submitBtn.disabled = false; submitBtn.textContent = 'Send Reset Token';
    }
});
</script>
</body>
</html>
