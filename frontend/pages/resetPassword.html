<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Alumni Connect</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="form-box">
    <h2><i class="fa-solid fa-lock"></i> Reset Password</h2>
    <p class="subtitle">Paste the reset token you received and set a new password.</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="resetForm">
        <div class="form-group">
            <label>Reset Token</label>
            <textarea id="token" rows="3" required placeholder="Paste your reset token here"></textarea>
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-block" id="submitBtn">Reset Password</button>
    </form>

    <p class="form-footer"><a href="login.html">&larr; Back to login</a></p>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
const form = document.getElementById('resetForm');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg(errorMsg); hideMsg(successMsg);
    submitBtn.disabled = true; submitBtn.textContent = 'Resetting...';

    try {
        const data = await apiFetch('/auth/reset-password', {
            method: 'PUT',
            body: JSON.stringify({
                token: document.getElementById('token').value.trim(),
                newPassword: document.getElementById('newPassword').value,
            }),
        });
        successMsg.textContent = data.message + ' Redirecting to login...';
        successMsg.style.display = 'block';
        setTimeout(() => window.location.href = 'login.html', 1500);
    } catch (err) {
        showError(errorMsg, err.message);
        submitBtn.disabled = false; submitBtn.textContent = 'Reset Password';
    }
});
</script>
</body>
</html>
