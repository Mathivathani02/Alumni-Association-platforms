<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Alumni Connect</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="form-box wide">
    <h2><i class="fa-solid fa-graduation-cap"></i> Create your account</h2>
    <p class="subtitle">Join the Alumni Association network</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="registerForm">
        <div class="form-row">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" required placeholder="Your full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-block" id="submitBtn">Create Account</button>
    </form>

    <p class="form-footer">Already have an account? <a href="login.html" style="color:var(--accent);font-weight:600;">Login</a></p>
    <p class="form-footer"><a href="../index.html">&larr; Back to home</a></p>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
redirectIfLoggedIn();

const form = document.getElementById('registerForm');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg(errorMsg); hideMsg(successMsg);
    submitBtn.disabled = true; submitBtn.textContent = 'Creating account...';

    try {
        const data = await apiFetch('/auth/register', {
            method: 'POST',
            body: JSON.stringify({
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            }),
        });
        saveSession(data);
        successMsg.textContent = 'Account created! Redirecting...';
        successMsg.style.display = 'block';
        setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (err) {
        showError(errorMsg, err.message);
        submitBtn.disabled = false; submitBtn.textContent = 'Create Account';
    }
});
</script>
</body>
</html>
