<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Alumni Connect</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="form-box">
    <h2><i class="fa-solid fa-graduation-cap"></i> Welcome back</h2>
    <p class="subtitle">Login to your Alumni Connect account</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn btn-block" id="submitBtn">Login</button>
    </form>

    <p class="form-footer"><a href="forgotPassword.html">Forgot password?</a></p>
    <p class="form-footer">New here? <a href="register.html" style="color:var(--accent);font-weight:600;">Create an account</a></p>
    <p class="form-footer"><a href="../index.html">&larr; Back to home</a></p>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
redirectIfLoggedIn();

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg(errorMsg);
    submitBtn.disabled = true; submitBtn.textContent = 'Logging in...';

    try {
        const data = await apiFetch('/auth/login', {
            method: 'POST',
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            }),
        });
        saveSession(data);
        window.location.href = 'dashboard.html';
    } catch (err) {
        showError(errorMsg, err.message);
        submitBtn.disabled = false; submitBtn.textContent = 'Login';
    }
});
</script>
</body>
</html>
